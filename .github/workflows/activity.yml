
name: Generate Contribution Activity Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check repository files
        run: |
          pwd
          ls -la
          ls -la scripts
          ls -la assets

      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python -u scripts/generate_activity.py

      - name: Check generated SVG
        run: |
          ls -lh assets/activity.svg
          head -n 5 assets/activity.svg

      - name: Commit generated graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub contribution activity graph"
          file_pattern: assets/activity.svg
